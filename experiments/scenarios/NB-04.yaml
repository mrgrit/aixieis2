    zones:
    - zone: ext
      cidr: 10.20.30.0/24
      trust: L0
      note: 인터넷 접점, 공격자 단말
    - zone: pipe
      cidr: 10.20.31.0/24
      trust: L1
      note: fw–ips 사이, 통과 트래픽만
    - zone: dmz
      cidr: 10.20.32.0/24
      trust: L2
      note: WAF, SIEM, 관리 포털
    - zone: int
      cidr: 10.20.40.0/24
      trust: L3
      note: 업무 앱 백엔드, WAF 경유만
    - zone: app
      cidr: 10.20.50.0/24
      trust: L3
      note: GPU 존
    - zone: ot
      cidr: 10.20.60.0/24
      trust: L3 격리
      note: 시설망, tcp/8000·ICMP만
    - zone: mgmt
      cidr: '-'
      trust: 논리
