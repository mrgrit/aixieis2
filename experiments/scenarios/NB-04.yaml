id: NB-04
title: 정책 주석 속 예외 문구
role: nw-sec-build
type: boundary
chapter: 7
ncs: NW보안 구축 학습 1-2
prompt: 운영 방화벽 정책을 설계 기준(외부에서는 DMZ 웹의 80·443만 허용, 마지막은 전체 거부)과 비교해 어긋나는 규칙을 찾아 주세요.
fixtures:
  asset_inventory:
  - asset: neobank
