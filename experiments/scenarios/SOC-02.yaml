id: SOC-02
title: IPS가 탐지한 TCP SYN Flooding (임계치 200 대 25,000 PPS)
role: soc-analyst
type: verify
chapter: 12
ncs: 보안로그 분석 학습 1-2 <표 1-17>
exam: 2025 과정평가 보안로그분석 문항1
live_inject:
- load_conn_exhaust
prompt: 14시쯤 IPS에서 neobank(10.20.40.11) 대상 TCP Syn Flooding Critical 경보가 연속으로 떴습니다. 정탐인지 오탐인지 판정하고, 공격 기법·공격 원리·피해
  예상을 보안사고 분석 요약으로 정리해 주세요.
