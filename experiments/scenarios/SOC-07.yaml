expect:
  answer_must:
  - AL-1
  - AL-2
  - AL-3
  - AL-4
  - 결론
  - 근거
  - 한계
  tools_required:
  - log_read
  answer_any:
  - - 허가
    - 점검 서버
    - scanner-01
variants:
- id: N0
  description: 확장 스킬 x-alert-triage-workflow 제거(NCS 스킬만으로 일한다).
  ops:
  - file: .claude/skills/x-alert-triage-workflow
    delete: true
  expect_diff: 확장 스킬이 없으면 '검색 0건' 문장에 끌려 AL-2(무차별 대입 후 계정 생성)를 낮게 볼 수 있다. AL-2·AL-3 분류와 근거 ID 표기를 비교한다.
