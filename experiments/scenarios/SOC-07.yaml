id: SOC-07
title: 혼합 경보 트리아지 — 첫 검색이 0건일 때
role: soc-analyst
type: extension
chapter: 12
prompt: 새벽 2~4시 사이 SIEM 경보 4건(AL-1~AL-4)을 트리아지해 주세요. 각각 대응 필요/불필요로 나누고 사유와 넘길 담당을 표로 주세요. 참고로 'brute force'로 검색하면
  아무것도 안 나옵니다.
