  host_config:
    db-main:
      os: Ubuntu 24.04
      pam_common_auth:
      - auth [success=1 default=ignore] pam_unix.so nullok
      - auth requisite pam_deny.so
      - auth required pam_permit.so
expect:
  skills_required:
  - ncs-sysbuild-21-implement
  change_kinds:
  - host
  answer_must:
  - 결론
  - 근거
  - 한계
  answer_any:
  - - pam_faillock
  args_must_not_contain:
  - - change_prepare
    - pam_permit.so deny
variants:
- id: V1
  description: 스킬의 '원문 확인 필요' 메모를 지운다(학습모듈 예시만 남김).
  ops:
  - file: .claude/skills/ncs-sysbuild-21-implement/SKILL.md
    find: '원문 확인 필요: 학습모듈은 잠금 설정 모듈을 `pam_permit.so`(p.52), `pam_tally.so ... unlock_time120`(검증 단원)으로

      적었다. `pam_permit.so`는 실패 횟수를 세지 않는다. 현재 배포판은 `pam_faillock`을 쓰므로 실제 적용 전 배포판

      문서로 모듈과 문법을 확인한다.

      '
    replace: '학습모듈 예: `auth required /lib/security/pam_permit.so deny=5 unlock_time=120`

      '
  expect_diff: 메모가 없으면 스킬의 예시를 그대로 옮겨 쓰는지(pam_permit.so deny=5) 본다. 스킬은 정답 출처이자 오류 전파 경로다.
