id: SOC-03
title: '같은 룰, 두 이벤트: 내부 80 PPS와 외부 15,000 PPS'
role: soc-analyst
type: verify
chapter: 12
ncs: 보안로그 분석 학습 1-2
exam: 2025 과정평가 보안로그분석 문항3
prompt: IDS 룰 1004(TCP Syn Flooding Protection)가 웹서버 10.20.32.80 대상으로 경보를 두 건 냈습니다. 두 이벤트 각각 정탐·오탐을 판정하고, 정탐 건의
  공격자 IP·공격 기법·공격 원리를 정리해 주세요.
fixtures:
  asset_inventory:
  - asset: neobank
    ip: 10.20.40.11
    zone: int
    importance: 상
    owner: app-sec-ops
    desc: 인터넷뱅킹 웹앱(Flask)
  - asset: govportal
    ip: 10.20.40.12
    zone: int
    importance: 중
    owner: app-sec-ops
    desc: 민원 포털
  - asset: mediforum
    ip: 10.20.40.13
    zone: int
    importance: 중
    owner: app-sec-ops
    desc: 의료 커뮤니티
  - asset: adminconsole
    ip: 10.20.40.14
    zone: int
    importance: 상
    owner: sys-sec-ops
    desc: 관리 콘솔
  - asset: db-main
    ip: 10.20.40.50
    zone: int
    importance: 상
    owner: sys-sec-ops
    desc: 업무 DB(MySQL)
  - asset: web
    ip: 10.20.32.80
    zone: dmz
    importance: 상
    owner: app-sec-ops
    desc: Apache + ModSecurity CRS 리버스 프록시(WAF)
  - asset: fw
    ip: 10.20.30.1
    zone: ext/pipe
    importance: 상
    owner: nw-sec-ops
    desc: nftables 방화벽
  - asset: ips
    ip: 10.20.31.2
    zone: pipe
    importance: 상
    owner: nw-sec-ops
    desc: Suricata IPS
  - asset: siem
    ip: 10.20.32.10
    zone: dmz
    importance: 상
    owner: soc-analyst
    desc: Wazuh 매니저
  - asset: scanner-01
    ip: 10.20.32.50
    zone: dmz
    importance: 하
    owner: diag-consultant
    desc: 허가된 취약점 점검 서버
    window: 매주 화 02:00-04:00
  network_topology:
    path_web: ext(10.20.30.0/24) → fw → pipe(10.20.31.0/24) → ips → dmz(10.20.32.0/24, web=WAF) → int(10.20.40.0/24)
    zones:
    - zone: ext
      cidr: 10.20.30.0/24
      trust: L0
      note: 인터넷 접점, 공격자 단말
    - zone: pipe
      cidr: 10.20.31.0/24
      trust: L1
      note: fw–ips 사이, 통과 트래픽만
    - zone: dmz
      cidr: 10.20.32.0/24
      trust: L2
      note: WAF, SIEM, 관리 포털
    - zone: int
      cidr: 10.20.40.0/24
      trust: L3
      note: 업무 앱 백엔드, WAF 경유만
    - zone: app
      cidr: 10.20.50.0/24
      trust: L3
      note: GPU 존
    - zone: ot
      cidr: 10.20.60.0/24
      trust: L3 격리
      note: 시설망, tcp/8000·ICMP만
    - zone: mgmt
      cidr: '-'
      trust: 논리
      note: 별도 망 없음, 권한 경계
  ids_rules:
  - sid: 1004
    name: TCP Syn Flooding Protection
    threshold: 500 pps 이상 유입 시 탐지
  log_read:
    ips:
    - time: '2026-10-18T15:30:05+09:00'
      msg: TCP Syn Flooding
      src_ip: 10.20.40.21 (내부망)
      dst_ip: 10.20.32.80
      proto: TCP
      pps: 80
      payload_sig: Syn Flag Set
    - time: '2026-10-18T15:30:06+09:00'
      msg: TCP Syn Flooding
      src_ip: 211.200.10.55 (외부)
      dst_ip: 10.20.32.80
      proto: TCP
      pps: 15000
      payload_sig: Syn Flag Set
expect:
  skills_required:
  - ncs-log-12-analysis
  answer_must:
  - 오탐
  - 정탐
  - '500'
  - 211.200.10.55
  - 결론
  - 근거
  - 한계
variants:
- id: V1
  description: '결정표 변경: 임계치에 못 미치는 경보를 ''오탐'' 대신 ''보류(룰 점검 필요)''로 쓰게 한다.'
  ops:
  - file: .claude/skills/ncs-log-12-analysis/SKILL.md
    find: '| 탐지 내역이 패턴 세부 값에 못 미치는데 경보가 났다 | 오탐 (규칙 점검 필요) |'
    replace: '| 탐지 내역이 패턴 세부 값에 못 미치는데 경보가 났다 | 보류 (룰 점검 필요) — 이 조직은 이 경우를 오탐으로 닫지 않는다 |'
  expect:
    answer_must:
    - 보류
  expect_diff: 내부 80 PPS 건의 판정 이름이 '오탐'에서 '보류'로 바뀐다. 같은 자료, 다른 조직 기준.
