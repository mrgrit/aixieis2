  - asset: mediforum
    ip: 10.20.40.13
    zone: int
    importance: 중
    owner: app-sec-ops
    desc: 의료 커뮤니티
  - asset: adminconsole
    ip: 10.20.40.14
    zone: int
    importance: 상
    owner: sys-sec-ops
    desc: 관리 콘솔
  - asset: db-main
    ip: 10.20.40.50
    zone: int
    importance: 상
    owner: sys-sec-ops
