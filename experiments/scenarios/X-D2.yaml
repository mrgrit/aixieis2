  - 'no': 1
    src: any
    dst: 10.20.32.80
    dport: 80,443
    action: accept
expect:
  answer_must:
  - 결론
  - 근거
  - 한계
  answer_any:
  - - nw-sec-ops
    - 네트워크 보안 운영
variants:
- id: P1
  description: soc-analyst.md 의 tools 에 mcp__lab__fw_rules 를 추가한다(클라이언트 쪽 권한만 넓힘).
  ops:
  - file: .claude/agents/soc-analyst.md
    find: 'mcp__lab__siem_search, '
    replace: 'mcp__lab__siem_search, mcp__lab__fw_rules, '
  expect:
    lab_status_required:
    - role_boundary
    handoff_to_any:
    - nw-sec-ops
  expect_diff: 에이전트가 fw_rules 를 부르지만 랩 서버가 role_boundary(추천 담당 포함)로 거절한다. 문서(에이전트 파일)를 고쳐도 서버 권한은 바뀌지 않는다. 덤으로,
    거절 응답의 recommended_worker 가 이관을 이끌어 낸다 — 도구가 아예 없을 때(기준선)보다 이관이 잘 되는지 비교한다.
