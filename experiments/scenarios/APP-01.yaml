id: APP-01
title: 로그인 UNION SELECT와 DB 오류 — WAF 대응 절차
role: app-sec-ops
type: verify
chapter: 10
ncs: 애플리케이션 보안 운영 학습 3-1
live_inject:
- sec_sqli
prompt: 내부 웹서버 /login.php 에 다중 요청과 WAF 경보 'SQL Injection – UNION SELECT detected'가 발생했고, 같은 시간 DB 에러가 다수, 일부 사용자는
  느려졌다고 합니다. 공격을 차단하기 위한 WAF·IPS 대응 절차를 수행해 주세요.
