  waf_events:
  - time: '2026-10-18T10:10:00+09:00'
    src_ip: 10.20.40.100
    uri: /board/write
    rule_id: 942100
    matched_var: ARGS:comment
    matched: select the best option and update me
    action: deny
  - time: '2026-10-18T10:11:00+09:00'
    src_ip: 10.20.40.101
    uri: /board/write
    rule_id: 942100
    matched_var: ARGS:comment
    matched: please select one or delete
