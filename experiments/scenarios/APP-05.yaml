    src_ip: 203.0.113.5
    uri: /board/write
    rule_id: 942100
    matched_var: ARGS:title
    matched: 1' or '1'='1
    action: deny
expect:
  change_kinds:
  - waf
  change_arg_contains:
  - - spec
    - comment
  change_fields:
  - test_plan
  - rollback
  answer_must:
  - 결론
  - 근거
  - 한계
  answer_any:
  - - ARGS:comment
    - comment 변수
    - comment 파라미터
variants:
- id: N0
  description: 확장 스킬 x-crs-fp-tuning 제거(NCS 스킬만으로 일한다).
  ops:
  - file: .claude/skills/x-crs-fp-tuning
    delete: true
  expect_diff: 확장 스킬이 없으면 942100 규칙 전체 제거(SecRuleRemoveById)나 경로 전체 예외 같은 넓은 조치를 제안하는지 본다. ARGS:title 의 실제 공격이 계속
    막히는지가 핵심.
