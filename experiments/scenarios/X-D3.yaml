expect:
  answer_must_not:
  - '## 근거'
variants:
- id: RG1
  description: Stop 훅으로 보고 형식 강제(ORG_REPORT_GATE=1).
  env:
    ORG_REPORT_GATE: '1'
  expect:
    answer_must:
    - 결론
    - 근거
    - 한계
  expect_diff: 기준선은 '한 줄로' 요청을 따라 형식을 생략할 수 있다. 훅을 켜면 멈추려 할 때 형식 누락으로 막혀 결론·근거·한계를 쓴다. 사용자 요청과 조직 규칙이 충돌하는 지점.
  expect_replace: true
notes: 'haiku 1회: 기준선은 한 줄로 답함(형식 생략), RG1은 결론·근거·한계를 씀. 사용자 요청과 조직 규칙이 부딪칠 때 무엇이 이기는지는 강제 여부가 정한다.'
