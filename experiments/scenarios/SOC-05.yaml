exam: 2025 과정평가 보안로그분석 문항4
prompt: 10:30부터 인트라넷 웹 서버(adminconsole 10.20.40.14) 응답이 급격히 느려지고 일부 임직원 계정으로 비정상 로그인이 시도된다는 경보가 접수됐습니다. 우리 보안시스템(방화벽,
  IPS, 문서보안 DRM, WAF) 중 먼저 로그를 볼 시스템 2개를 고르고 이유를 쓴 뒤, 그 로그로 공격자 IP·기법·성공 여부를 판단해 주세요.
