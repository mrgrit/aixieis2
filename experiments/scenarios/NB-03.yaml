id: NB-03
title: 내부망이라 믿는 규칙 찾기
role: nw-sec-build
type: extension
chapter: 7
prompt: 현재 구간 설계를 검토해서 개선이 필요한 접근 통제를 찾아 주세요.
fixtures:
  asset_inventory:
  - asset: neobank
    ip: 10.20.40.11
    zone: int
    importance: 상
    owner: app-sec-ops
    desc: 인터넷뱅킹 웹앱(Flask)
  - asset: govportal
    ip: 10.20.40.12
    zone: int
    importance: 중
    owner: app-sec-ops
    desc: 민원 포털
  - asset: mediforum
    ip: 10.20.40.13
    zone: int
    importance: 중
    owner: app-sec-ops
    desc: 의료 커뮤니티
  - asset: adminconsole
    ip: 10.20.40.14
    zone: int
    importance: 상
    owner: sys-sec-ops
    desc: 관리 콘솔
  - asset: db-main
    ip: 10.20.40.50
    zone: int
    importance: 상
    owner: sys-sec-ops
    desc: 업무 DB(MySQL)
  - asset: web
    ip: 10.20.32.80
    zone: dmz
    importance: 상
    owner: app-sec-ops
    desc: Apache + ModSecurity CRS 리버스 프록시(WAF)
  - asset: fw
    ip: 10.20.30.1
    zone: ext/pipe
    importance: 상
    owner: nw-sec-ops
    desc: nftables 방화벽
  - asset: ips
    ip: 10.20.31.2
    zone: pipe
    importance: 상
    owner: nw-sec-ops
    desc: Suricata IPS
  - asset: siem
    ip: 10.20.32.10
    zone: dmz
    importance: 상
    owner: soc-analyst
    desc: Wazuh 매니저
  - asset: scanner-01
    ip: 10.20.32.50
    zone: dmz
    importance: 하
    owner: diag-consultant
    desc: 허가된 취약점 점검 서버
    window: 매주 화 02:00-04:00
  network_topology:
    path_web: ext(10.20.30.0/24) → fw → pipe(10.20.31.0/24) → ips → dmz(10.20.32.0/24, web=WAF) → int(10.20.40.0/24)
    zones:
    - zone: ext
      cidr: 10.20.30.0/24
      trust: L0
      note: 인터넷 접점, 공격자 단말
    - zone: pipe
      cidr: 10.20.31.0/24
      trust: L1
      note: fw–ips 사이, 통과 트래픽만
    - zone: dmz
      cidr: 10.20.32.0/24
      trust: L2
      note: WAF, SIEM, 관리 포털
    - zone: int
      cidr: 10.20.40.0/24
      trust: L3
      note: 업무 앱 백엔드, WAF 경유만
    - zone: app
      cidr: 10.20.50.0/24
      trust: L3
      note: GPU 존
    - zone: ot
      cidr: 10.20.60.0/24
      trust: L3 격리
      note: 시설망, tcp/8000·ICMP만
    - zone: mgmt
      cidr: '-'
      trust: 논리
      note: 별도 망 없음, 권한 경계
  fw_rules:
  - 'no': 1
    src: 10.20.40.0/24
    dst: 10.20.40.0/24
    dport: any
    action: accept
    comment: 내부망 상호 신뢰
  - 'no': 2
    src: 10.20.40.0/24
    dst: 10.20.32.10
    dport: '5601'
    action: accept
    comment: SIEM 대시보드(인증 없음)
  - 'no': 3
    src: any
    dst: any
    dport: any
    action: drop
expect:
  answer_must:
  - 결론
  - 근거
  - 한계
  answer_any:
  - - 동서
    - 내부망 상호
    - 서버끼리
  - - 인증
variants:
- id: N0
  description: 확장 스킬 x-zero-trust-segmentation 제거(NCS 스킬만으로 일한다).
  ops:
  - file: .claude/skills/x-zero-trust-segmentation
    delete: true
  expect_diff: 확장 스킬이 있으면 '위치 기반 신뢰' 문제를 자원 단위 정책안으로 바꿔 제시하는지 본다.
