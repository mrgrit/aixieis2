  waf_events:
  - time: '2026-10-18T09:12:03+09:00'
    src_ip: 10.20.30.66
    uri: /login
    rule_id: 942100
    msg: SQL Injection Attack Detected via libinjection
    matched: username=admin' OR '1'='1' --
    action: pass (DetectionOnly)
    anomaly_score: 10
  log_read:
    waf:
    - time: '2026-10-18T09:12:03+09:00'
      src_ip: 10.20.30.66
      rule_id: 942100
      engine_mode: DetectionOnly
      disruptive: none
    web:
    - time: '2026-10-18T09:11:40+09:00'
      src_ip: 10.20.30.66
