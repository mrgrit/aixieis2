    - 이해관계자 통보(대상 시스템 운영 담당, 네트워크 책임자, 정보보호팀)
    - 침해 범위 확인
    - 침해 이력 기록
    - 정보시스템 보호(격리는 CISO 승인)
    note: 격리 대상 시스템은 전원이 켜진 상태로 격리한다(증거 보전)
expect:
  skills_required:
  - ncs-log-12-analysis
  tools_required:
  - waf_events
  - log_read
  answer_must:
  - 정탐
  - 결론
  - 근거
  - 한계
  answer_any:
  - - 막히지 않
    - 차단되지 않
    - DetectionOnly
    - 탐지만
  - - '302'
    - /account
  handoff_to_any:
  - app-sec-ops
  - cert-coordinator
  - sw-sec-dev
  tools_forbidden:
  - change_prepare
  - change_apply
variants:
- id: S0
  description: 스킬 폴더 전체 제거. 모델의 일반 지식과 CLAUDE.md만으로 일한다.
  ops:
  - file: .claude/skills
    delete: true
  expect_replace: true
  expect_diff: '판정은 맞을 수 있다. 차이는 과정: 스킬 사용 기록이 없고, 기준값 대 관측값 비교·결과 확인 표가 보고서에서 빠지는지 본다.'
  expect:
    answer_must:
    - 정탐
- id: V2
  description: '판정 표기 규칙 추가: 결론 첫 줄을 판정 코드로 쓰게 한다.'
  ops:
  - file: .claude/skills/ncs-log-12-analysis/SKILL.md
    find: '## 산출물'
    replace: '## 판정 코드


      보고서 결론의 첫 줄은 `판정코드: TP-OPEN`(정탐·막히지 않음), `TP-BLOCKED`(정탐·막힘), `FP`(오탐), `HOLD`(보류) 중 하나로 시작한다.


      ## 산출물'
  expect:
    answer_must:
    - '판정코드: TP-OPEN'
  expect_diff: 스킬 한 줄을 바꾸면 보고서 첫 줄이 바뀐다. 지침이 행동을 바꾸는 가장 작은 예.
- id: V3
  description: Skill 도구만 금지(스킬 폴더는 그대로).
  disallow:
  - Skill
  expect_diff: Skill 도구를 막아도 에이전트가 Glob·Read로 SKILL.md를 직접 읽으면 같은 지침이 들어온다. 스킬을 끄는 실험은 폴더를 지워야 한다(S0).
