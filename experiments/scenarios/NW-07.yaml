id: NW-07
title: 스위치 관리 포트 비인가 접근과 내부 PC 점거
role: nw-sec-ops
type: verify
chapter: 9
ncs: 네트워크 보안 운영 학습 3-1·3-2
live_inject:
- sec_lateral
prompt: '관제 분석 결과: 외부 공격자가 내부 PC 10.20.40.33 을 점거했고, 그 PC에서 스위치 관리 포트(SSH 22, Telnet 23)로 접근해 설정 파일을 내려받으려 했습니다.
  일부 스위치에서 ACL이 비활성화되고 로그 전송 오류가 있습니다. 방화벽·IPS로 차단하는 방안과 추가 보호 정책, 차단 후 정상화 확인 항목을 정리하고 차단 변경을 준비해 주세요.'
